<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TBtech - Automazione industriale</title>
    <meta name="description" content="TBtech: automazione indutriale su misura. Software custom IEC 61131, Progettazione elettrica CEI 64-8, consulenza, collaudo e messa in servizio.">
    
    <link rel="stylesheet" href="style.css">

    <!-- mappa posizione -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

</head>
<body>
    <header class="sito-header" data-elevate>
        <!-- desktop header-->
        <div class=" container dentro-header">
            <a href="#home" class="cont-logo" aria-label="TBtech Home">
                <img src="logo.png" alt="TBtech logo" class="logo">
            </a>

            <nav class="navig" aria-label="Barra di Navigazione">
                <a href="#home" class="link-navig" data-nav>Home</a>
                <a href="#chi-siamo" class="link-navig" data-nav>Chi Siamo</a>
                <a href="servizi" class="link-navig" data-nav>Servizi</a>
                <a href="progetti" class="link-navig" data-nav>Progetti</a>
                <a href="contatti" class="link-navig" data-nav>Contatti</a>
            </nav>

            <div class="azioni-header">
                <a href="#contatti" class="btn btn-fantasma">Parliamone</a>
                <a href="#servizi" class="btn btn-primario">Scopri i servizi</a>
            </div>

            <button class="icona-btn burger" type="button" aria-label="Apertura menu" aria-expanded="false" data-burger>
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>

        <!-- mobile header-->
        <div class="mobile-header" data-drawer>
            <div class="container dentro-mobile-header">
                <a href="#home" class="link-navig" data-nav>Home</a>
                <a href="#chi-siamo" class="link-navig" data-nav>Chi siamo</a>
                <a href="#servizi" class="link-navig" data-nav>Servizi</a>
                <a href="#progetti" class="link-navig" data-nav>Progetti</a>
                <a href="#contatti" class="link-navig" data-nav>Contatti</a>
                <div class="mobile-cont">
                    <a href="#contatti" class="btn btn-primario">Contattaci</a>
                </div>
            </div>
        </div>
    </header>

    <main id="home">

    </main>
</body>
</html>
